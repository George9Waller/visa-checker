name: Type Check
on:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/visa_checker?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visa_checker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d visa_checker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run typecheck
